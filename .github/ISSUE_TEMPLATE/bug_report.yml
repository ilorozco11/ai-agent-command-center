name: Bug report
description: Report a reproducible problem in the prototype.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic tasks and do not include private repository information or credentials.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, operating system, and browser.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant logs or screenshots with sensitive information removed.
